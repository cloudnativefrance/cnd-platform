apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-plane
spec:
  description: "PostgreSQL cluster for the application Plane"
  instances: 2

  bootstrap:
    initdb:
      database: plane
      owner: plane
      secret:
        name: plane-cnpg-secret

  superuserSecret:
    name: plane-cnpg-secret

  storage:
    storageClass: node-local-retain
    size: 10Gi

  backup:
    barmanObjectStore:
      destinationPath: "s3://cloudnativedaysfr/cnpg/plane"
      endpointURL: "https://s3.fr-par.scw.cloud"
      s3Credentials:
        accessKeyId:
          name: cnd-france-scw-secret
          key: access-key-id
        secretAccessKey:
          name: cnd-france-scw-secret
          key: secret-access-key
        region:
          name: cnd-france-scw-secret
          key: region
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "90d"

  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    disableDefaultQueries: false
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - action: replace
        sourceLabels:
          - cluster
        targetLabel: cnpg_cluster
      - action: labeldrop
        regex: cluster

  resources:
    requests:
      memory: "512Mi"
      cpu: 200m
    limits:
      # 2x the request, not equal to it — the reasoning is written out in
      # analytics/cnpg-cluster.yaml: equal values make the pod Guaranteed QoS
      # with zero burst room, and the midnight ScheduledBackup runs
      # barman-cloud-backup with gzip compression and S3 upload buffers inside
      # this same pod, as does pg_basebackup on a replica resync.
      memory: "1Gi"
