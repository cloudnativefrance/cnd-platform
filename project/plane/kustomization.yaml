apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnd-project

# The six SealedSecrets are produced by ./.bootstrap.sh and are NOT in this
# repo until that script has run — it needs the cluster's sealing certificate.
# Run it before opening the PR, or `kustomize build` here fails on the missing
# files (which is the intended signal, not a bug).
#
# cnd-france-scw-secret is deliberately absent: it is shared with baserow and
# is listed one level up, in project/kustomization.yaml.
#
# ORDERING: the migrator Job in helmrelease.yaml has backoffLimit 3 and no
# wait-for-database logic, so it can exhaust its retries against a CNPG cluster
# that is not Ready yet and wedge the release. That is sequenced by merging the
# foundation PR first and waiting — which covers the FIRST rollout only. It is
# not encoded: on a DR restore or cluster rebuild every file here is applied in
# one pass, which is exactly the race.
#
# `dependsOn` does only take Kustomization refs, but Flux `healthChecks` accept
# `postgresql.cnpg.io/v1 Cluster`, and this repo already relies on that
# (clusters/k8s-cndfrance-prod/analytics.yaml, shortener.yaml). Splitting plane
# into its own Flux Kustomization with a healthCheck on Cluster/cnpg-plane would
# make the ordering hold on every reconcile. Deliberately left as a follow-up.
resources:
  - plane-cnpg-secret.yaml
  - plane-app-secret.yaml
  - plane-live-secret.yaml
  - plane-docstore-secret.yaml
  - plane-rabbitmq-secret.yaml
  - plane-godmode-auth-secret.yaml
  - cnpg-cluster.yaml
  - cnpg-scheduled-backup.yaml
  - helmrelease.yaml
  - ingress.yaml
  - ingress-godmode.yaml
