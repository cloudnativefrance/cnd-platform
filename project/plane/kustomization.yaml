apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnd-project

# The six SealedSecrets are produced by ./.bootstrap.sh and are NOT in this
# repo until that script has run — it needs the cluster's sealing certificate.
# Run it before opening the PR, or `kustomize build` here fails on the missing
# files (which is the intended signal, not a bug).
#
# cnd-france-scw-secret is deliberately absent: it is shared with baserow and
# is listed one level up, in project/kustomization.yaml.
#
# ORDERING: the migrator Job in helmrelease.yaml has backoffLimit 3 by default
# and no wait-for-database logic, so it can exhaust its retries against a CNPG
# cluster that is not Ready yet. The postRenderer raises that to 20, which rides
# out a cold cluster on a DR restore or rebuild — where every file here is
# applied in one pass and no human is sequencing merges.
#
# That is a mitigation, not an encoding. `dependsOn` only takes Kustomization
# refs, but Flux `healthChecks` do accept `postgresql.cnpg.io/v1 Cluster`, and
# this repo already relies on that (clusters/k8s-cndfrance-prod/shortener.yaml).
# Giving plane its own Flux Kustomization is the real fix; left as a follow-up.
resources:
  - plane-cnpg-secret.yaml
  - plane-app-secret.yaml
  - plane-live-secret.yaml
  - plane-docstore-secret.yaml
  - plane-rabbitmq-secret.yaml
  - plane-godmode-auth-secret.yaml
  - cnpg-cluster.yaml
  - cnpg-scheduled-backup.yaml
  - helmrelease.yaml
  - ingress.yaml
  - ingress-godmode.yaml
  - ingress-live.yaml
