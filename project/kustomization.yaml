apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Both children set this too. Declaring it here means a namespace-less resource
# added at THIS level cannot silently render into `default` — it is a no-op for
# everything currently rendered.
namespace: cnd-project

# Explicit children, like communication/kustomization.yaml.
#
# Without this file Flux generates a kustomization by scanning ./project
# recursively — unambiguous while baserow was the only child, guesswork now
# that plane/ joins it. The file existed until 89610f0 deleted it (when
# openproject/ was its only remaining child); this restores the pattern rather
# than inventing a new one.
#
# cnd-france-scw-secret is listed HERE, not inside a child: it is a
# namespace-scoped credential that baserow (S3 uploads, CNPG backups) and plane
# (CNPG backups, doc store) both consume. Leaving it in project/baserow/ meant
# plane's backups would break if baserow were ever removed. SealedSecrets bind
# to name+namespace, not to a file path, so moving the file needs no resealing.
resources:
  - cnd-france-scw-secret.yaml
  - baserow
  - plane
