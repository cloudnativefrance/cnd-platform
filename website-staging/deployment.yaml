apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: cnd-website-staging
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/component: static-site
    app.kubernetes.io/part-of: cnd-france
spec:
  # One replica: staging validates content and layout, not availability.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
        app.kubernetes.io/component: static-site
        app.kubernetes.io/part-of: cnd-france
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      containers:
        - name: website
          # Sentinel tag: deliberately does not exist in the registry, so
          # this pod fails loudly with ImagePullBackOff rather than silently
          # serving the wrong content. Rewritten by the cnd-website-staging
          # ImageUpdateAutomation once the website repo's `staging` branch
          # publishes its first staging-<sha>-<ts> image. Until then this
          # pod stays in ImagePullBackOff on purpose.
          image: ghcr.io/cloudnativefrance/website:staging-b227260-1788534539 # {"$imagepolicy": "flux-system:cnd-website-staging"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
