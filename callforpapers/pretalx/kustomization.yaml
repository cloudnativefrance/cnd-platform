apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnd-callforpapers

resources:
  - cnd-france-scw-secret.yaml
  - cnpg-cluster.yaml
  - cnpg-scheduled-backup.yaml
  - brevo-smtp-secret.yaml
  - configmap.yaml
  - nginx-configmap.yaml
  - helmrelease-valkey.yaml
  - ingress.yaml
  - pretalx-cnpg-secret.yaml
  - service.yaml
  - statefulset.yaml
  - valkey-secret.yaml

# The cndfr_speaker_gate pretalx plugin (see plugins/), shipped without a custom
# image: statefulset.yaml mounts it on /plugins and sets PYTHONPATH, so pretalx
# finds it through the entry point in its .dist-info. The name hash rolls the
# pod whenever the plugin changes.
configMapGenerator:
  - name: pretalx-plugins
    files:
      - plugins/cndfr_speaker_gate/__init__.py
      - plugins/cndfr_speaker_gate/apps.py
      - plugins/cndfr_speaker_gate/signals.py
      - plugins/cndfr_speaker_gate-1.0.0.dist-info/METADATA
      - plugins/cndfr_speaker_gate-1.0.0.dist-info/entry_points.txt
