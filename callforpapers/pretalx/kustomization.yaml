apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnd-callforpapers

resources:
  - cnd-france-scw-secret.yaml
  - cnpg-cluster.yaml
  - cnpg-scheduled-backup.yaml
  - brevo-smtp-secret.yaml
  - configmap.yaml
  - nginx-configmap.yaml
  - helmrelease-valkey.yaml
  - ingress.yaml
  - pretalx-cnpg-secret.yaml
  - service.yaml
  - statefulset.yaml
  - valkey-secret.yaml

# pretalx plugin mounted on /plugins by statefulset.yaml (see plugins/README.md).
# The name hash rolls the pod whenever the plugin changes.
configMapGenerator:
  - name: pretalx-plugins
    files:
      - plugins/cndfr_speaker_gate/__init__.py
      - plugins/cndfr_speaker_gate/apps.py
      - plugins/cndfr_speaker_gate/signals.py
      - plugins/cndfr_speaker_gate.dist-info/METADATA
      - plugins/cndfr_speaker_gate.dist-info/entry_points.txt
