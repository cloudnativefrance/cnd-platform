name: pretalx plugin

# See callforpapers/pretalx/plugins/README.md.
on:
  pull_request:
    paths: ["callforpapers/pretalx/**", ".github/workflows/pretalx-plugin.yaml"]
  push:
    branches: ["main"]
    paths: ["callforpapers/pretalx/**", ".github/workflows/pretalx-plugin.yaml"]

jobs:
  tests:
    name: pretalx plugin tests 🐍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run plugin tests
        run: ./callforpapers/pretalx/plugins/run-tests.sh -q
